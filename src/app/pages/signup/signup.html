<section class="signup-section">

  <div class="signup-container">

    <!-- BRANDING SECTION -->
    <div class="signup-brand">

      <div class="brand-icon">E</div>

      <h1>Join EstateHub!</h1>

      <p>
        Create your account and discover a smarter
        way to find, buy, rent and manage properties.
      </p>

      <div class="brand-features">
        <span>✓ Explore Premium Properties</span>
        <span>✓ Connect With Expert Agents</span>
        <span>✓ Save Your Favourite Homes</span>
      </div>

    </div>

    <!-- REGISTRATION FORM -->
    <div class="signup-form-wrapper">

      <div class="form-heading">
        <h2>Create Account</h2>
        <p>Fill in your details to get started.</p>
      </div>

      <form class="signup-form">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password" required>
        </div>

        <div class="terms-option">
          <input type="checkbox" id="terms" required>
          <label for="terms">
            I agree to the Terms and Conditions
          </label>
        </div>

        <button type="submit" class="signup-submit">
          Create Account
        </button>

      </form>

      <div class="login-prompt">
        Already have an account?
        <a routerLink="/login">Sign In</a>
      </div>

    </div>

  </div>

</section>
