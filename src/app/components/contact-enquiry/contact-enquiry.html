<section class="enquiry-section" id="enquiry-form">

  <div class="enquiry-container">

    <div class="enquiry-heading">
      <span class="section-tag">GET IN TOUCH</span>
      <h2>Send Us an Enquiry</h2>
      <p>Interested in this property? Share your details with us.</p>
    </div>

    <div class="enquiry-card" *ngIf="!submitted; else successMessage">

      <form (ngSubmit)="submitEnquiry()">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" [(ngModel)]="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" [(ngModel)]="message" placeholder="Tell us how we can help you..."
            rows="5" required></textarea>
        </div>

        <button type="submit" class="submit-button">
          Submit Enquiry
        </button>

      </form>

    </div>

    <ng-template #successMessage>

      <div class="success-message">
        <h3>Thank You!</h3>
        <p>Your enquiry has been submitted successfully.</p>
      </div>

    </ng-template>

  </div>

</section>
